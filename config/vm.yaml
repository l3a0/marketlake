# The hosted VM's non-secret settings, marketlake #686.
#
# The VM's config.yaml is rendered from this file, four SSM parameters and two instance
# tags, by `python -m lake.vm_config render < config/vm.yaml`. cloud-init's first boot runs
# that render, and every run of #676's deploy/vm-deploy.sh runs it again through the
# bootstrap, so a reviewed pull request is the one way these settings change. The
# parameters carry the four secrets. The instance's marketlake:backup-target tag carries
# the backup target, which infra/live/vm.tf writes from the bucket OpenTofu already holds.
# No tracked file may name that bucket, and this one may not set backup_target. The optional
# marketlake:cost-export tag carries cost_export, the cost export's location, #913, so this
# file may not set cost_export either.
#
# #638's cutover flipped `role` to primary here, in its own pull request. The way back's
# rehearsal set it to shadow while the laptop ran one session as primary, and its return set
# it to primary again once the VM's resync had run and the laptop was a shadow again.
#
# `lake_root` is the lake volume's mount point. It changes only with a replacement of the
# instance, because a kept instance's fstab line would still name the old path.
#
# `lake_window_sessions` is how many recent sessions the VM keeps on its lake volume, and the
# opt-in to trimming older partitions once the bucket holds them, #755 and #786. With it set,
# the 18:30 sweep writes the split checkpoint, and #787's trim reads it. The owner chose 22 on
# 2026-10-07 (decision 1 on #755), to be set once du was measured per surface. #786 measured
# it on 2026-10-08, and chains were nearly all of each session's growth, so 22 stands. The
# render refuses a value under the floor the readers of sealed chains and quotes need, which
# lake.window derives. The key also picks what `lake.bucket restore` brings back: with it,
# the restore rebuilds this trimmed lake from the bucket, #785.
#
# `lake_window_sessions_bars: all` keeps every bars session on the VM, #953, from the owner's
# ruling of 2026-10-29 on #938. Chains and quotes have no key of their own here, so each takes
# lake_window_sessions's 22, and the split checkpoint is cut at the chains window's edge. A bar
# is a few KB a day, and imported history lands under bars/ too. Raising a window brings
# nothing back, so bars trimmed before this key reached the VM need the one-time restore in
# infra/README.md, #958.
#
# Removing lake_window_sessions stops the checkpoint and the trim, and makes the restore bring
# back the whole lake, which outgrows the volume as the lake grows. A lasting rollback of
# trimming removes lake_window_sessions and every per-surface key together, because the render
# refuses a per-surface key left on its own and keeps the old config.yaml, which would leave
# the trim running.
role: primary
lake_root: /srv/marketlake
token_store: store
bucket_credentials: instance_profile
bucket_region: us-east-1
lake_window_sessions: 22
lake_window_sessions_bars: all
