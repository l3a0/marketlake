<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<title>Marketlake status</title>
<style>
  :root {
    color-scheme: light dark;
    --captured: #2e8b57;
    --suspect: #e0a800;
    --gap: #c0392b;
    --missing: #7f8c8d;
    --pending: rgba(127, 127, 127, 0.18);
    /* Out of scope is a slot before the ticker's capture_start epoch. It means "not
       expected", not "lost", so it gets a hue of its own rather than a shade of the
       greys that carry missing and pending. */
    --out-of-scope: #4f74c8;
    /* The shadow-append alarm. A hue no status cell uses, so it never reads as a gap. */
    --alarm: #b5179e;
    --note: #a35b00;
    --rule: rgba(127, 127, 127, 0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --captured: #3aa870;
      --suspect: #f0bd2f;
      --gap: #ff6f61;
      --missing: #9aa5a6;
      --out-of-scope: #7fa0f2;
      --alarm: #ff86d8;
      --note: #ffb454;
    }
  }
  body {
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 1.5rem auto;
    max-width: 1100px;
    padding: 0 1rem;
  }
  header { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  h1 { font-size: 1.4rem; margin: 0; }
  h2 { font-size: 1.1rem; margin: 0 0 .5rem; }
  section { margin-top: 1.75rem; }
  .muted { opacity: .7; }
  .note { color: var(--note); }
  .alarm { color: var(--alarm); font-weight: 700; }
  button { font: inherit; padding: .2rem .7rem; }
  /* Nine columns outgrow a narrow window. The table scrolls inside its own box, so the
     page itself never scrolls sideways and the strips below stay where they were. */
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .3rem .5rem; border-bottom: 1px solid var(--rule); }
  th { font-weight: 600; }
  td.num { font-variant-numeric: tabular-nums; }
  .stale { color: var(--gap); font-weight: 600; }
  .daemon { margin: .6rem 0 0; padding-left: 1.1rem; }
  .daemon li { margin: .1rem 0; }
  .strip-label {
    display: flex; justify-content: space-between; gap: .5rem;
    flex-wrap: wrap; margin-top: .6rem;
  }
  .strip { display: flex; gap: 1px; height: 18px; margin: .2rem 0 .1rem; }
  .strip div { flex: 1 1 0; min-width: 1px; }
  .captured { background: var(--captured); }
  .suspect { background: var(--suspect); }
  .gap { background: var(--gap); }
  .missing { background: var(--missing); }
  .pending { background: var(--pending); }
  .out_of_scope { background: var(--out-of-scope); }
  /* A status the page does not recognize. Drift renders as itself, never as a status. */
  .unknown { background: repeating-linear-gradient(45deg, var(--alarm) 0 2px, transparent 2px 4px); }
  /* The heatmap. One row per strip, one cell per session in the window. A cell's
     colour comes from its slot counts, never from its percent: a day nothing was owed
     and a day every owed minute was missed both read zero percent, and they are
     opposite facts. The percent rides in the tooltip beside the counts that produced
     it, and a day that owed nothing has no percent at all. */
  .heat-row { display: flex; align-items: center; gap: .5rem; margin: .25rem 0; }
  .heat-name { flex: 0 0 9.5rem; font-variant-numeric: tabular-nums; }
  .heat { display: flex; gap: 2px; flex: 1 1 auto; height: 20px; }
  .heat div { flex: 1 1 0; min-width: 2px; border-radius: 2px; }
  .heat-dates {
    display: flex; gap: 2px; margin: .1rem 0 0 10rem;
    font-size: .75rem; opacity: .7;
  }
  .heat-dates span { flex: 1 1 0; min-width: 2px; text-align: center; overflow: hidden; }
  .ledger { margin: .6rem 0 0; padding-left: 1.1rem; }
  .ledger li { margin: .15rem 0; font-variant-numeric: tabular-nums; }
  .nightly { margin: .6rem 0 0; padding: 0; list-style: none; }
  .nightly li { border-top: 1px solid var(--rule); padding: .4rem 0; }
  .nightly .lines { margin: .2rem 0 0; padding-left: 1.1rem; }
  .empty { opacity: .7; font-style: italic; }
  .legend { margin: .4rem 0 .6rem; }
  .legend i { display: inline-block; width: 12px; height: 12px; vertical-align: -1px; margin: 0 .3rem 0 .9rem; }
  .legend i:first-child { margin-left: 0; }
  #error {
    display: none;
    margin-top: 1rem;
    padding: .6rem .8rem;
    border: 1px solid var(--gap);
    border-radius: 4px;
    color: var(--gap);
  }
  #error.shown { display: block; }
  .chip {
    border: 1px solid var(--gap);
    border-radius: 999px;
    color: var(--gap);
    font-weight: 700;
    padding: .05rem .55rem;
  }
  /* A failed refresh must not leave a panel asserting an old "now". Each panel says it
     is stale where the reader is standing, and the values behind the note wash out. */
  .stale-note {
    display: none;
    margin: .3rem 0 .7rem;
    padding: .4rem .6rem;
    border-left: 4px solid var(--gap);
    color: var(--note);
    font-weight: 600;
  }
  body.degraded .stale-note { display: block; }
  body.degraded .panel { opacity: .55; filter: grayscale(85%); }
  /* The degraded wash says "this is not live", and it follows the load that failed. Now
     and Today share one load, so they wash together. History has its own, so a live
     History section is not greyed out because the minute above it went stale, and a
     failed one says so in its own words rather than borrowing that banner. */
  body.degraded #history-panel { opacity: 1; filter: none; }
  body.degraded #asof { opacity: .5; }
</style>
</head>
<body>
<header>
  <h1>Marketlake</h1>
  <span id="asof" class="muted">loading&hellip;</span>
  <span id="freshness"></span>
  <button id="refresh" type="button">Refresh</button>
</header>
<div id="error"></div>

<section>
  <h2>Now <span id="phase" class="muted"></span></h2>
  <p id="now-stale" class="stale-note"></p>
  <div class="panel">
    <div class="table-wrap">
      <table>
        <thead>
          <tr id="now-head">
            <th>Ticker</th><th>Surface</th><th>Capture start (ET)</th>
            <th>Last data cycle (ET)</th><th>Minutes since</th><th>Latest slot (ET)</th>
            <th>Status</th><th>Reason</th><th>Segment health</th>
          </tr>
        </thead>
        <tbody id="now-rows"></tbody>
      </table>
    </div>
    <ul id="daemon" class="muted daemon"></ul>
  </div>
</section>

<section>
  <h2>Today <span id="session" class="muted"></span></h2>
  <p id="today-stale" class="stale-note"></p>
  <div class="panel">
    <div class="legend">
      <i class="captured"></i><span title="A data cycle landed.">captured</span>
      <i class="suspect"></i><span title="A data cycle landed, flagged for the validation battery to judge.">suspect</span>
      <i class="gap"></i><span title="A gap row records the missed minute and its reason.">gap</span>
      <i class="missing"></i><span title="A judged slot with no row at all, not even a gap marker.">missing</span>
      <i class="pending"></i><span title="A slot whose cycle may still be running, so it is not judged yet.">pending</span>
      <i class="out_of_scope"></i><span title="A slot before the ticker's capture_start epoch, the instant capture began for that ticker. Minutes before it are out of scope, never gaps.">out of scope</span>
    </div>
    <div id="strips"></div>
  </div>
</section>

<section>
  <h2>History <span id="window" class="muted"></span></h2>
  <div class="panel" id="history-panel">
    <h3 class="muted">Completeness</h3>
    <div id="heat"></div>
    <h3 class="muted">Open quarantines <span id="quarantine-count"></span></h3>
    <div id="quarantines"></div>
    <h3 class="muted">Nightly reports <span id="reports-note" class="muted"></span></h3>
    <div id="reports"></div>
  </div>
</section>

<script>
(function () {
  "use strict";
  // The lake's slots are session times, so the page renders them in Eastern time.
  var ET = "America/New_York";
  var timeFmt = new Intl.DateTimeFormat("en-US", {
    timeZone: ET, hour: "2-digit", minute: "2-digit", hour12: false
  });
  var stampFmt = new Intl.DateTimeFormat("en-US", {
    timeZone: ET, month: "short", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
  });
  var REFRESH_MS = 60000;
  // The daemon stamps every minute it is awake. Two minutes allows for a slow write and
  // the page's own refresh landing between stamps, and still calls a stopped writer
  // stale well inside the dead-man's own grace.
  var STALE_STAMP_MINUTES = 2;
  var DASH = "—";

  // The six slot statuses, in the order the strip summary reports them. A cell's class
  // comes from this map and never from the payload string itself, so a status the page
  // does not know renders as drift rather than as an unstyled cell.
  var STATUSES = ["captured", "suspect", "gap", "missing", "pending", "out_of_scope"];
  var STATUS_CLASS = {
    captured: "captured", suspect: "suspect", gap: "gap",
    missing: "missing", pending: "pending", out_of_scope: "out_of_scope"
  };
  var STATUS_LABEL = {
    captured: "captured", suspect: "suspect", gap: "gap",
    missing: "missing", pending: "pending", out_of_scope: "out of scope"
  };
  var UNKNOWN_CLASS = "unknown";
  var UNKNOWN_LABEL = "unrecognized status";

  // The four statuses a verdict is owed on. A heatmap cell takes its colour from the
  // largest of these, so an onboarding day reads as what happened to the minutes that
  // were owed rather than being dominated by the ones that were not. Pending and
  // out-of-scope are left out for that reason, and a cell with no judged minute at all
  // falls back to whichever of the two it is.
  var JUDGED = ["captured", "suspect", "gap", "missing"];

  // The nightly report's counts, in the order the file writes them. Each is null when
  // the run could not take it, which is a different answer from zero and renders as one.
  var NIGHTLY_COUNTS = [
    {key: "gaps", label: "gaps"},
    {key: "quarantined", label: "quarantined"},
    {key: "disagreements", label: "disagreements"},
    {key: "unfiled", label: "unfiled"},
    {key: "pages_lost", label: "pages lost"}
  ];

  // The five segment-health counters, each named for what it is. One integer cannot
  // carry these, so the page never sums them. A shadow append leads and is loud: bytes
  // written past a segment's end-of-stream marker are rows every standard reader stops
  // short of, and the design pins that failure as one that must never be silent.
  var HEALTH = [
    {
      key: "shadow_append_segments",
      one: "shadow-append segment", many: "shadow-append segments",
      className: "alarm",
      title: "Bytes were written past a segment's end-of-stream marker. A reader stops " +
        "at that marker, so those rows are invisible to it. The design pins this as a " +
        "failure that must never be silent."
    },
    {
      key: "unreadable_segments",
      one: "unreadable segment", many: "unreadable segments",
      className: "note",
      title: "The segment's bytes could not be read: a torn header, or not an Arrow stream at all."
    },
    {
      key: "vanished_segments",
      one: "vanished segment", many: "vanished segments",
      className: "note",
      title: "The segment was listed and then gone. Compaction sealing the day mid-read looks like this."
    },
    {
      key: "drifted_segments",
      one: "drifted segment", many: "drifted segments",
      className: "note",
      title: "A required provenance column is missing, or it cannot be cast back to its pinned type."
    },
    {
      key: "drifted_rows",
      one: "drifted row", many: "drifted rows",
      className: "note",
      title: "Rows whose row_kind is neither data nor gap. They are counted here rather " +
        "than mistaken for a gap."
    }
  ];

  // The instant of the last successful load, and the as_of the panels are showing. Both
  // are null until one load succeeds.
  var lastGoodAt = null;
  var lastGoodAsOf = null;
  var inFlight = false;

  function byId(id) { return document.getElementById(id); }

  function el(tag, text, className) {
    var node = document.createElement(tag);
    if (text !== undefined && text !== null) { node.textContent = String(text); }
    if (className) { node.className = className; }
    return node;
  }

  function clear(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }

  function fmt(iso, formatter) {
    if (!iso) { return DASH; }
    return formatter.format(new Date(iso));
  }

  function stamp(when) { return stampFmt.format(when); }

  function plural(count, one, many) { return count + " " + (count === 1 ? one : many); }

  function getJSON(url) {
    return fetch(url, { cache: "no-store" }).then(function (r) {
      if (!r.ok) { throw new Error(url + " returned " + r.status); }
      return r.json();
    });
  }

  function capturing(now) {
    return now.phase === "open" || now.phase === "post_equity_close";
  }

  // -- freshness ------------------------------------------------------------

  function setStaleNotes(text) {
    byId("now-stale").textContent = text;
    byId("today-stale").textContent = text;
  }

  function staleText(failedAt) {
    if (lastGoodAt === null) {
      return "No load has succeeded yet. This panel holds no data. The attempt at " +
        stamp(failedAt) + " ET failed.";
    }
    return "Stale. This panel shows the load from " + stamp(lastGoodAt) + " ET. Its data " +
      "was as of " + fmt(lastGoodAsOf, stampFmt) + " ET. The refresh at " +
      stamp(failedAt) + " ET failed.";
  }

  function markFresh(now) {
    lastGoodAt = new Date();
    lastGoodAsOf = now.as_of;
    document.body.classList.remove("degraded");
    var box = byId("error");
    box.textContent = "";
    box.className = "";
    var chip = byId("freshness");
    chip.textContent = "";
    chip.className = "";
    setStaleNotes("");
  }

  function markStale(message) {
    var failedAt = new Date();
    document.body.classList.add("degraded");
    var box = byId("error");
    box.textContent = "The query service is unreachable or failing: " + message +
      ". Nothing below is live.";
    box.className = "shown";
    var chip = byId("freshness");
    chip.textContent = lastGoodAt === null
      ? "stale, no load has succeeded"
      : "stale, last good load " + stamp(lastGoodAt) + " ET";
    chip.className = "chip";
    setStaleNotes(staleText(failedAt));
  }

  // -- shared cell parts ----------------------------------------------------

  function healthSpans(source) {
    var spans = [];
    HEALTH.forEach(function (counter) {
      var count = source[counter.key];
      if (typeof count !== "number" || count <= 0) { return; }
      var span = el("span", plural(count, counter.one, counter.many), counter.className);
      span.title = counter.title;
      spans.push(span);
    });
    return spans;
  }

  function appendJoined(node, parts) {
    parts.forEach(function (part, index) {
      if (index > 0) { node.appendChild(el("span", ", ", "muted")); }
      node.appendChild(part);
    });
  }

  // Every reason the slot carried arrives as a list, ordered alphabetically by the
  // query. Joining them names all of them, so nothing beside it has to say how many
  // there were. An empty list is truthy in JavaScript, so callers test its length.
  function reasonText(classes) {
    if (!classes || !classes.length) { return ""; }
    return classes.join(", ");
  }

  // -- the Now panel --------------------------------------------------------

  function renderNow(now) {
    byId("asof").textContent = "as of " + fmt(now.as_of, stampFmt) + " ET";
    byId("phase").textContent = now.is_session
      ? "(" + now.session_date + ", " + now.phase.replace(/_/g, " ") + ")"
      : "(" + now.session_date + ", no session)";
    var body = byId("now-rows");
    clear(body);
    if (now.surfaces.length === 0) {
      var empty = el("tr");
      var cell = el("td", "No tickers found under the lake root yet.", "muted");
      cell.colSpan = document.querySelectorAll("#now-head th").length;
      empty.appendChild(cell);
      body.appendChild(empty);
    }
    now.surfaces.forEach(function (row) {
      body.appendChild(nowRow(now, row));
    });
    renderDaemon(now);
  }

  function nowRow(now, row) {
    var tr = el("tr");
    tr.appendChild(el("td", row.ticker));
    tr.appendChild(el("td", row.surface));
    tr.appendChild(captureStartCell(row));
    tr.appendChild(el("td", fmt(row.last_data_snap_ts, stampFmt)));
    tr.appendChild(minutesSinceCell(now, row));
    tr.appendChild(el("td", fmt(row.last_snap_ts, stampFmt)));
    tr.appendChild(el("td", row.last_status || DASH));
    tr.appendChild(reasonCell(row));
    tr.appendChild(healthCell(row));
    return tr;
  }

  function captureStartCell(row) {
    var cell = el("td");
    if (!row.capture_start) {
      cell.textContent = DASH;
      return cell;
    }
    cell.appendChild(el("span", fmt(row.capture_start, stampFmt)));
    if (row.in_scope === false) {
      var tag = el("span", " (not started)", "muted");
      tag.title = "The clock has not reached this ticker's capture_start epoch. Capture " +
        "has not begun for it, so an empty row is what this ticker should look like.";
      cell.appendChild(tag);
    }
    return cell;
  }

  // A ticker whose capture_start is still ahead of the clock has no minutes-since to be
  // late by. It is not onboarded yet, so it is never painted stale.
  //
  // The verdict is the payload's, in row.stale. The number in the cell is the age
  // against now, which is what a reader wants to see, and the verdict is against the
  // last minute a cycle was owed, which is the only minute that age means anything
  // against. The two part company the moment the session ends: a healthy ticker's age
  // climbs all evening while its verdict stays clean, and a ticker that captured
  // nothing all day stays stale from the option close onward rather than falling back
  // to plain text in the hours the day gets reviewed in.
  function minutesSinceCell(now, row) {
    var text = row.minutes_since === null ? DASH : row.minutes_since.toFixed(1);
    var cell = el("td", text, "num");
    if (row.in_scope === false) {
      cell.className = "num muted";
    } else if (row.stale) {
      cell.className = "num stale";
      cell.title = staleTitle(now);
    }
    return cell;
  }

  // The threshold is worth saying out loud, because the reading changes with the hour
  // and a bare red cell cannot say which reading it is.
  function staleTitle(now) {
    if (capturing(now)) {
      return "No durable data cycle in the last " +
        plural(now.stale_after_minutes, "minute", "minutes") +
        ", the threshold the watchdog pages at.";
    }
    if (now.capture_owed_through === null) {
      return "No session has closed yet, so there is no minute to read this against.";
    }
    return "No durable data cycle in the " +
      plural(now.stale_after_minutes, "minute", "minutes") + " before " +
      fmt(now.capture_owed_through, stampFmt) + " ET, the last minute a cycle was owed. " +
      "The session is over, so the age keeps climbing on its own and the same threshold " +
      "reads against that minute rather than against now.";
  }

  function reasonCell(row) {
    var cell = el("td");
    var reasons = reasonText(row.last_error_class);
    if (reasons) {
      cell.appendChild(el("span", reasons));
    }
    if (row.in_scope === false) {
      if (cell.firstChild) { cell.appendChild(el("span", ", ", "muted")); }
      cell.appendChild(el("span", "capture has not started"));
    }
    if (row.lookback_exhausted) {
      if (cell.firstChild) { cell.appendChild(el("span", ", ", "muted")); }
      var floorNote = el("span", "no data cycle in the days walked");
      floorNote.title = "The newest-first day walk hit its cap before it found a data " +
        "cycle. Older days were not read. So this is a floor on the age, not proof that " +
        "the ticker never captured.";
      cell.appendChild(floorNote);
    }
    if (!cell.firstChild) { cell.textContent = DASH; }
    return cell;
  }

  function healthCell(source) {
    var cell = el("td");
    appendJoined(cell, healthSpans(source));
    if (!cell.firstChild) { cell.textContent = DASH; }
    return cell;
  }

  // The countdown runs past zero once the ritual is overdue, because a clamped zero
  // reads the same as a ritual due this minute. A negative wait is said as one.
  function countdownText(minutes) {
    if (minutes < 0) {
      return "Sunday re-mint overdue by " + plural(-minutes, "minute", "minutes") + ".";
    }
    return "Sunday re-mint in " + plural(minutes, "minute", "minutes") + ".";
  }

  // The dead-man line's verdict is the payload's, in dead_man_starved. The page could
  // compare the age to the grace itself, and that comparison would be wrong twice over.
  // Nothing pings outside the daemon's weekday envelope, by design, so judging every
  // minute would go loud every night and every weekend, and a line that is loud every
  // night is one the reader learns to skip. Judging only the minutes inside the envelope
  // fails the other way: a check that starved at 17:00 stays starved, and the line would
  // fall quiet at 18:45 while healthchecks stayed down. Both readings need the envelope,
  // which is the control plane's window, so the answer comes from the server rather than
  // from a second copy of that window here.
  //
  // dead_man_expected is the narrower question, whether a ping is owed this minute. The
  // line says that in words and never colours by it.
  //
  // What feeds the check depends on the hour, so the line says which. Inside the capture
  // window only a durable data cycle feeds it, because the idle heartbeat stands down
  // there by design. That is why this line, and not the stamp below it, is what goes
  // loud when capture is dead. Past the option close the heartbeat resumes, so a fresh
  // ping there says the daemon is alive and says nothing at all about capture.
  function deadManText(now) {
    if (now.dead_man_last_ping === null) {
      return now.dead_man_starved
        ? "Dead-man ping: never recorded, and one is owed now."
        : "Dead-man ping: not recorded yet.";
    }
    var fired = "Dead-man ping last fired " + fmt(now.dead_man_last_ping, stampFmt) +
      " ET, " + plural(now.dead_man_age_minutes, "minute", "minutes") + " ago.";
    if (now.dead_man_starved) {
      var past = fired + " That is past the grace of " +
        plural(now.dead_man_grace_minutes, "minute", "minutes") + ", so the check is ";
      return now.dead_man_expected
        ? past + "starving: either no cycle is producing data, or the daemon has stopped."
        : past + "down, and it went down before the daemon's weekday window closed.";
    }
    if (!now.dead_man_expected) {
      return fired + " The daemon's weekday window is closed, so none is owed.";
    }
    if (!capturing(now)) {
      return fired + " The session is not capturing now, so the idle heartbeat is " +
        "feeding the check rather than a data cycle.";
    }
    return fired;
  }

  // Ten payload fields describe the daemon rather than a ticker. They render as five
  // lines, because the token line carries its own age and the dead-man line carries
  // four values beside its ping. A null instant means nothing has been stamped yet, so
  // the line says that rather than showing a zero. The page count is never null,
  // because a day with no file written is a true zero. The grace and the expectation
  // are never null either, since they come from the clock rather than from the lake.
  //
  // The stamp age comes last and reads on the token lines above it. The daemon stamps
  // every minute it is awake, so a stamp older than STALE_STAMP_MINUTES means the writer
  // stopped and the mint, the age and the countdown are what a dead daemon last said. It
  // alarms at that point for the same reason. It does not disclaim the dead-man line,
  // because a stopped writer stops the ping too, so that line reads a dead daemon
  // correctly rather than going stale with it. It is the line the operator needs exactly
  // when the stamp has gone old.
  //
  // What the stamp line cannot say is whether capture worked, because the stamp rides
  // every minute the loop runs and a session of nothing but gaps stamps each of them.
  // So the line says what it is not, rather than letting a reader take a fresh stamp
  // for health. It does not point at the dead-man line for the answer, because past the
  // option close that line is reading the idle heartbeat and cannot give one either.
  function renderDaemon(now) {
    var list = byId("daemon");
    clear(list);
    var items = [
      {
        text: now.token_minted_at === null
          ? "Refresh token mint: not recorded yet."
          : "Refresh token minted " + fmt(now.token_minted_at, stampFmt) + " ET, " +
            plural(now.token_age_minutes, "minute", "minutes") + " ago."
      },
      {
        text: now.token_sunday_countdown_minutes === null
          ? "Sunday re-mint countdown: not recorded yet."
          : countdownText(now.token_sunday_countdown_minutes),
        className: now.token_sunday_countdown_minutes < 0 ? "alarm" : null
      },
      {
        text: deadManText(now),
        className: now.dead_man_starved ? "alarm" : null
      },
      {
        text: now.pages_failed_to_send === null
          ? "Pages that failed to send: not recorded yet."
          : plural(now.pages_failed_to_send, "page", "pages") + " failed to send.",
        className: now.pages_failed_to_send > 0 ? "alarm" : null
      },
      {
        text: now.stamp_age_minutes === null
          ? "Stamp: nothing written yet, so the four lines above are unread."
          : now.stamp_age_minutes > STALE_STAMP_MINUTES
            ? "Stamp is " + plural(now.stamp_age_minutes, "minute", "minutes") +
              " old, so the token lines above are what the daemon last said, not now. " +
              "The dead-man line judges its own age, so it still holds."
            : "Stamp written " + plural(now.stamp_age_minutes, "minute", "minutes") +
              " ago, so the loop is running. The loop stamps every minute whether or " +
              "not it captured anything, so this line never says capture worked.",
        className: now.stamp_age_minutes === null ||
          now.stamp_age_minutes > STALE_STAMP_MINUTES ? "alarm" : null
      }
    ];
    items.forEach(function (item) {
      list.appendChild(el("li", item.text, item.className));
    });
  }

  // -- the Today panel ------------------------------------------------------

  function renderToday(today) {
    var session = byId("session");
    var strips = byId("strips");
    clear(strips);
    if (!today.is_session) {
      session.textContent = "(" + today.date + ", no session)";
      strips.appendChild(el("p", "The calendar calls this day closed.", "muted"));
      return;
    }
    session.textContent = "(" + today.date + ", " + today.slot_count + " slots, " +
      fmt(today.session_open, timeFmt) + "–" + fmt(today.option_close, timeFmt) +
      " ET" + (today.early_close ? ", early close" : "") + ")";
    if (today.strips.length === 0) {
      strips.appendChild(el("p", "No tickers found under the lake root yet.", "muted"));
    }
    today.strips.forEach(function (strip) {
      strips.appendChild(stripLabel(strip));
      strips.appendChild(stripCells(strip));
    });
  }

  function stripLabel(strip) {
    var label = el("div", null, "strip-label");
    var name = el("span");
    name.appendChild(el("strong", strip.ticker + " " + strip.surface));
    if (strip.capture_start) {
      var began = el("span", " capture began " + fmt(strip.capture_start, stampFmt) + " ET", "muted");
      began.title = "The ticker's capture_start epoch. Slots before it are out of scope, never gaps.";
      name.appendChild(began);
    }
    label.appendChild(name);
    var right = el("span");
    var parts = [el("span", countsText(strip.counts), "muted")].concat(healthSpans(strip));
    appendJoined(right, parts);
    label.appendChild(right);
    return label;
  }

  function countsText(counts) {
    return STATUSES.map(function (status) {
      return (counts[status] || 0) + " " + STATUS_LABEL[status];
    }).join(", ");
  }

  function stripCells(strip) {
    var row = el("div", null, "strip");
    strip.slots.forEach(function (slot) {
      var cell = el("div", null, STATUS_CLASS[slot.status] || UNKNOWN_CLASS);
      var tip = fmt(slot.slot, timeFmt) + " " + (STATUS_LABEL[slot.status] || UNKNOWN_LABEL);
      if (slot.rows > 0) { tip += ", " + plural(slot.rows, "row", "rows"); }
      var reasons = reasonText(slot.error_class);
      if (reasons) { tip += ", " + reasons; }
      cell.title = tip;
      row.appendChild(cell);
    });
    return row;
  }

  // -- the History panel ----------------------------------------------------

  // A cell's colour, from its counts rather than its percent. A day nothing was owed
  // and a day every owed minute was missed both read zero percent, and they are
  // opposite facts, so the percent never decides what a cell looks like.
  function heatStatus(cell) {
    var counts = cell.counts || {};
    if (!(cell.judged > 0)) {
      return counts.pending > 0 ? "pending" : "out_of_scope";
    }
    var best = JUDGED[0];
    JUDGED.forEach(function (status) {
      if ((counts[status] || 0) > (counts[best] || 0)) { best = status; }
    });
    return best;
  }

  function heatTitle(cell) {
    var parts = [cell.date + "  " + cell.ticker + " " + cell.surface];
    parts.push(cell.captured_pct === null
      ? "no minute was owed, so there is no percent to give"
      : cell.captured_pct + "% of " + plural(cell.judged, "minute owed", "minutes owed"));
    STATUSES.forEach(function (status) {
      var n = (cell.counts || {})[status] || 0;
      if (n > 0) { parts.push(plural(n, STATUS_LABEL[status], STATUS_LABEL[status])); }
    });
    HEALTH.forEach(function (counter) {
      var n = cell[counter.key] || 0;
      if (n > 0) { parts.push(plural(n, counter.one, counter.many)); }
    });
    return parts.join("\n");
  }

  function renderHeat(history) {
    var box = byId("heat");
    clear(box);
    if (history.sessions.length === 0) {
      box.appendChild(el("p", "The window holds no session.", "empty"));
      return;
    }
    var rows = {};
    var order = [];
    history.cells.forEach(function (cell) {
      var key = cell.ticker + " " + cell.surface;
      if (!rows[key]) { rows[key] = []; order.push(key); }
      rows[key].push(cell);
    });
    order.forEach(function (key) {
      var row = el("div", null, "heat-row");
      row.appendChild(el("span", key, "heat-name"));
      var strip = el("div", null, "heat");
      rows[key].forEach(function (cell) {
        var status = heatStatus(cell);
        var box2 = el("div", null, STATUS_CLASS[status] || UNKNOWN_CLASS);
        box2.title = heatTitle(cell);
        strip.appendChild(box2);
      });
      row.appendChild(strip);
      box.appendChild(row);
    });
    var dates = el("div", null, "heat-dates");
    history.sessions.forEach(function (day, index) {
      // Every session has a cell and only some have room for a label, so the first and
      // the last are named and the rest are read off a cell's own tooltip.
      var first = index === 0;
      var last = index === history.sessions.length - 1;
      dates.appendChild(el("span", first || last ? day.slice(5) : ""));
    });
    box.appendChild(dates);
  }

  function renderQuarantines(history) {
    var chip = byId("quarantine-count");
    var box = byId("quarantines");
    clear(box);
    if (history.quarantine_unreadable !== null) {
      chip.textContent = "";
      // The ledger raises on a damaged line and the panel reports it rather than dying,
      // so the reader is told the count is unknown instead of being shown a false zero.
      box.appendChild(el("p",
        "The quarantine ledger could not be read: " + history.quarantine_unreadable +
        ". This list is not a zero, it is unknown.", "alarm"));
      return;
    }
    chip.textContent = "(" + history.quarantine_count + ")";
    if (history.quarantines.length === 0) {
      box.appendChild(el("p", "No partition is withheld.", "empty"));
      return;
    }
    var list = el("ul", null, "ledger");
    history.quarantines.forEach(function (entry) {
      // Every check still withholding, each with its own verdict, because signing one off
      // leaves the rest standing and two checks can withhold under two different spellings.
      var checks = (entry.checks || []).map(function (c) {
        var name = c.check === null || c.check === undefined ? DASH : c.check;
        var said = c.verdict === null || c.verdict === undefined ? DASH : c.verdict;
        return name + " " + said;
      }).join(", ");
      var text = checks === ""
        ? entry.partition + "  " + (entry.verdict === null ? DASH : entry.verdict)
        : entry.partition + "  " + checks;
      list.appendChild(el("li", text));
    });
    box.appendChild(list);
    // Signing off is a separate flock-guarded tool, so this panel names it and stops.
    box.appendChild(el("p",
      "Signing a partition off runs the quarantine sign-off tool. This panel only reads.",
      "muted"));
  }

  function renderReports(history) {
    var note = byId("reports-note");
    var box = byId("reports");
    clear(box);
    var notes = [];
    if (history.reports_error !== null) {
      notes.push("the directory could not be listed: " + history.reports_error);
    }
    if (history.reports_unreadable > 0) {
      notes.push(plural(history.reports_unreadable, "file would not parse", "files would not parse"));
    }
    note.textContent = notes.length === 0 ? "" : "(" + notes.join("; ") + ")";
    note.className = notes.length === 0 ? "muted" : "alarm";
    if (history.reports.length === 0) {
      box.appendChild(el("p",
        "No nightly report has been filed yet. The evening sweep writes the first one.",
        "empty"));
      return;
    }
    var list = el("ul", null, "nightly");
    history.reports.forEach(function (entry) { list.appendChild(reportItem(entry)); });
    box.appendChild(list);
  }

  function reportItem(entry) {
    var item = el("li");
    // The report is the one pre-written thing this page shows, so it leads with the day
    // it is about and the instant it was written. A stale one never reads as now.
    var head = el("div");
    head.appendChild(el("strong", entry.day === null ? DASH : entry.day));
    head.appendChild(el("span", "  filed " + (entry.at === null ? DASH : entry.at), "muted"));
    if (entry.session === false) { head.appendChild(el("span", "  no session", "muted")); }
    if (entry.pinged === false) { head.appendChild(el("span", "  did not ping", "alarm")); }
    item.appendChild(head);
    var counts = [];
    NIGHTLY_COUNTS.forEach(function (counter) {
      var value = entry[counter.key];
      // Null is no number rather than zero, and the run says so beside it.
      counts.push(counter.label + " " + (value === null || value === undefined ? DASH : value));
    });
    item.appendChild(el("div", counts.join("   "), "muted"));
    // ``pieces`` is not rendered beside ``problems``. The sweep appends "<walk> did not
    // run: <refusal>" to its problems for every walk that refused, so a page showing
    // both prints each refusal twice. The payload keeps the structured form for a
    // reader that wants the walk rather than the sentence.
    appendLines(item, entry.problems, "alarm");
    appendLines(item, entry.report, "note");
    return item;
  }

  function appendLines(item, lines, className) {
    if (!lines || lines.length === 0) { return; }
    var list = el("ul", null, "lines");
    lines.forEach(function (line) { list.appendChild(el("li", line, className)); });
    item.appendChild(list);
  }

  function renderHistory(history) {
    byId("window").textContent =
      history.window_start + " to " + history.window_end + ", " +
      plural(history.sessions.length, "session", "sessions");
    renderHeat(history);
    renderQuarantines(history);
    renderReports(history);
  }

  // -- the refresh cycle ----------------------------------------------------

  // Now and Today are fetched together and painted together. A partial failure would
  // otherwise leave a fresh Now table beside a Today strip from the previous poll, with
  // the page mixing two instants and saying so nowhere.
  //
  // History is deliberately not on that chain. It answers a different question over a
  // different span, a month of sessions rather than this minute, so it cannot mix two
  // instants with either of them. Joining it was tried and is wrong: its window reaches
  // thirty days back, so one drifted partition a month old would take the whole page
  // down while the two panels reading today were both healthy. It fails into its own
  // section instead, and the page above it keeps working.
  function refresh() {
    if (inFlight) { return; }
    inFlight = true;
    var pending = null;
    var history = getJSON("/api/history").then(renderHistory, historyFailed);
    getJSON("/api/now").then(function (now) {
      pending = now;
      return getJSON("/api/today?date=" + encodeURIComponent(now.session_date));
    }).then(function (today) {
      renderNow(pending);
      renderToday(today);
      markFresh(pending);
    }).catch(function (err) {
      markStale(err.message);
    }).then(function () {
      return history;
    }).then(function () {
      inFlight = false;
    });
  }

  // The History section saying its own load failed. It never touches the page-wide
  // banner, because the panels above it are still live and that banner says they are not.
  function historyFailed(err) {
    byId("window").textContent = "";
    clear(byId("heat"));
    byId("quarantine-count").textContent = "";
    clear(byId("quarantines"));
    byId("reports-note").textContent = "";
    clear(byId("reports"));
    byId("heat").appendChild(el("p",
      "The history query is failing: " + err.message +
      ". Nothing in this section is live. The panels above it are.", "alarm"));
  }

  byId("refresh").addEventListener("click", refresh);
  refresh();
  setInterval(refresh, REFRESH_MS);
})();
</script>
</body>
</html>
