# Marketlake: keep needrestart from restarting the marketlake units after apt runs.
# A restart would cost the daemon its in-flight cycle mid-session. needrestart lists
# them as deferred instead, and `needrestart -b` names what still maps an old
# library, so a patched glibc reaches them at their next restart.
$nrconf{override_rc}->{qr(^com\.marketlake\.)} = 0;
