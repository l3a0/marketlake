name: Evidence 1004
on: pull_request
permissions:
  contents: read
jobs:
  seal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version-file: ".tool-versions"
      - run: uv sync --dev
      - name: The seal's bytes, defb939 against this branch
        env:
          MARKETLAKE_CONFIG_DIR: /tmp/cfg
        run: |
          uname -sm
          uv run python -c "import pyarrow; print(pyarrow.__version__)"
          mkdir -p /tmp/cfg
          git worktree add -q --detach /tmp/base defb9393
          P=$PWD/.venv/bin/python
          (cd /tmp/base && PYTHONPATH=/tmp/base/src $P $GITHUB_WORKSPACE/evidence1004/run.py /tmp/base /tmp/o1 > /tmp/base.txt)
          PYTHONPATH=$PWD/src $P evidence1004/run.py $PWD /tmp/o2 > /tmp/head.txt
          wc -l /tmp/base.txt /tmp/head.txt
          grep -c parquet /tmp/base.txt
          sed -E 's/-[0-9]+\.json/.json/' /tmp/base.txt > /tmp/b; sed -E 's/-[0-9]+\.json/.json/' /tmp/head.txt > /tmp/h
          diff /tmp/b /tmp/h && echo IDENTICAL
      - name: The sealed literals against defb939's own seal
        run: |
          sed -e 's/^from lake import journal, measure, segment_join, unsealed/from lake import journal/' -e '/^# -- the two functions/,$d' tests/component/test_segment_join.py > /tmp/base/tests/component/test_seal_literals.py
          cd /tmp/base && PYTHONPATH=/tmp/base/src $GITHUB_WORKSPACE/.venv/bin/python -m pytest -q tests/component/test_seal_literals.py
      - name: The whole suite
        run: rm -rf evidence1004 .github/workflows/evidence1004.yml && uv run pytest -n auto -q | tail -15
        shell: bash -eo pipefail {0}
