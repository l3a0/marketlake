name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # This ceiling sits far above the job's usual run time, so it only fires on a
    # hang, and it replaces GitHub's six-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.2"
          enable-cache: true

      - name: Install the toolchain and dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      # A pull request runs the suite across cores, and a push to main runs it in one
      # process. pytest-xdist ignores how a worker process exits once its last test has
      # reported, so a crash at interpreter shutdown, such as a segfault while Arrow
      # frees memory, leaves a parallel run green where a serial run exits 139. The
      # serial run on main is what still turns that crash red, one merge late (#746).
      - name: Run the test suite across cores
        if: github.event_name == 'pull_request'
        run: uv run pytest -n auto

      - name: Run the test suite in one process
        if: github.event_name != 'pull_request'
        run: uv run pytest
