name: Board

# Starts the build board's rebuild, which the reusable workflow
# .github/workflows/build-board.yml in l3a0/repo-template carries out at commit
# fd8317e537a3d85423757c56c034ace623878a81. That workflow checks out its own
# generator, scripts/build_board.py, and its own page,
# .claude/skills/update-build-board/board.html, at the same commit, so the
# board changes only when the pin on the `uses:` line moves (#942). Moving it
# means reading build-board.yml at the new commit, since its inputs and the
# scopes its jobs ask for can change with it, and updating the record of them
# in tests/component/test_board_workflow.py. Check two things there as well.
# The called deploy job must keep `environment: github-pages`, and no other
# called job may gain `id-token: write`. A job holding that scope with no
# environment, on a pull_request_target run, would mint an OIDC token whose
# subject ends in `:pull_request`, which an AWS role in
# infra/bootstrap/roles.tf trusts.
#
# Before #942 this repository carried its own generator and page under
# .claude/skills/sync-prune-next. The inputs under `with:` turn on, one by one,
# what that page did and the shared page does not do by default.
#
# A label, a body edit or a comment starts a run through `issues` and
# `issue_comment`. A "blocked by" link and a sub-issue start none, because
# GitHub Actions lists no trigger for either, so they reach the board on the
# next scheduled run.
#
# Every trigger below, workflow_dispatch included, fires only once this file is
# on main. Every one but workflow_dispatch runs on the default branch.
# pull_request_target runs on a pull request's base branch, so its filter admits
# only pull requests into main. workflow_dispatch alone can run another ref,
# and what stops such a run from deploying is the github-pages environment's
# deployment branch policy, which names main only.
#
# No step here reads the event payload, and the reusable workflow checks out no
# pull request's code and names every action by a commit SHA, which its own
# header explains. This file holds no expression at all, since every input is a
# literal.
on:
  issues:
  issue_comment:
  # Its default types are opened, synchronize and reopened. A merged Part of pull
  # request closes no issue, so without `closed` it would read as open until the
  # scheduled run, and without `edited` so would a corrected closing link.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed, edited]
  # The only event that fires when a pull request's checks settle. Infra runs on pull
  # requests too, and its checks enter the same rollups.
  workflow_run:
    workflows: [CI, Infra]
    types: [completed]
  # The backstop for what starts no run, such as a "blocked by" link. GitHub can delay
  # or drop a scheduled run under load. The shared generator's `longest_gap_minutes`
  # reads this line as raw text to say when the board is stale, and fails the run on a
  # line it cannot read. Off the hour, because the top of the hour is when GitHub is
  # busiest.
  schedule:
    - cron: "19,49 * * * *"
  workflow_dispatch:

permissions: {}

# Runs deploy one at a time, so an older snapshot never replaces a newer one. GitHub
# keeps only the newest waiting run, which is the one worth deploying, so a cancelled
# run is normal here.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  board:
    # The union of the scopes the reusable workflow's two jobs declare, because a
    # called workflow can only narrow what its caller grants. Each of its jobs
    # narrows this to what it uses.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read
      pages: write
      id-token: write
    uses: l3a0/repo-template/.github/workflows/build-board.yml@fd8317e537a3d85423757c56c034ace623878a81
    # The shared workflow's inputs at that commit. Each is a string, and an empty
    # one leaves the shared board's default in place.
    with:
      title: Marketlake Build Board
      icon: .github/board/favicon.ico
      subtitle: the order of work on the capture-first option-chain lake
      note: >-
        What each deliverable is for lives in
        [the design doc](https://github.com/l3a0/marketlake/blob/main/docs/design.md),
        and the slice order in
        [the build plan](https://github.com/l3a0/marketlake/blob/main/docs/build-plan.md).
        The order below follows the repository's ranking rule: capture reliability
        first, then what makes the lake usable, and evidence from real use over any
        ranking made in advance.
      default-branch-head: "true"
      milestone-default: MVP <n>
      ranking: order
      owner-body-lines: "true"
      review-heading: Review complete
      settled-rollup: "true"
      sort-labels: "true"
      label-colors: "true"
