name: Board

# Rebuilds the build board from GitHub and publishes it on GitHub Pages, so no session
# has to measure and write it by hand (#872). .claude/skills/sync-prune-next/build_board.py
# reads every figure through the API and writes board.json, and the page beside it,
# board.html, fetches that file every two minutes. Session judgements reach it as
# working: labels and as lines the owner writes in comments and issue bodies, which
# the board-markers skill describes (#873).
#
# A label, a body edit or a comment starts a run through `issues` and `issue_comment`.
# A "blocked by" link and a sub-issue start none, because GitHub Actions lists no
# trigger for either, so they reach the board on the next scheduled run.
#
# Every trigger below, workflow_dispatch included, fires only once this file is on
# main. Every one but workflow_dispatch runs on the default branch.
# pull_request_target runs on a pull request's base branch, so its filter admits only
# pull requests into main. workflow_dispatch alone can run another ref, and what stops
# such a run from deploying is the github-pages environment's deployment branch
# policy, which names main only.
#
# Two rules keep strangers out of this workflow, and keep it inside the ruleset, which
# refuses a merge while CodeQL reports a high or critical alert.
#
# 1. No step reads the event payload. Anyone can file an issue on a public repository,
#    so an issue title expanded into a run step would run as shell. The generator reads
#    everything through gh, which also makes a run's output independent of the event
#    that started it. The only expressions here are the job token and the deployed
#    page's address.
# 2. pull_request_target runs with a write token on the default branch, so nothing here
#    checks out a pull request's code. The checkout takes the default ref and keeps no
#    credentials.
#
# No job is named `test`, because the ruleset on main requires a check by that name and
# ci.yml provides it. The jobs' names, board-build and board-deploy, are also how the
# generator drops this workflow's own checks from a pull request's rollup. Every action
# is pinned to a commit, because the deploy job can mint an OIDC token.
on:
  issues:
  issue_comment:
  # Its default types are opened, synchronize and reopened. A merged Part of pull
  # request closes no issue, so without `closed` it would read as open until the
  # scheduled run, and without `edited` so would a corrected closing link.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed, edited]
  # The only event that fires when a pull request's checks settle. Infra runs on pull
  # requests too, and its checks enter the same rollups.
  workflow_run:
    workflows: [CI, Infra]
    types: [completed]
  # The backstop for what starts no run, such as a "blocked by" link. GitHub can delay
  # or drop a scheduled run under load. Off the hour, because the top of the hour is
  # when GitHub is busiest.
  schedule:
    - cron: "19,49 * * * *"
  workflow_dispatch:

permissions: {}

# Runs deploy one at a time, so an older snapshot never replaces a newer one. GitHub
# keeps only the newest waiting run, which is the one worth deploying, so a cancelled
# run is normal here.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  board-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Declaring any scope sets every unlisted one to none, so each scope the generator
    # reads is named.
    permissions:
      contents: read # the checkout, and the default branch's head
      issues: read # open issues, their bodies, comments, labels, milestones and links
      pull-requests: read # open pull requests, their comments and reviews
      checks: read # check runs in each head commit's rollup
      statuses: read # status contexts in each head commit's rollup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's own Python, which is 3.12. The generator is standard library only.
      - name: Build board.json from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .claude/skills/sync-prune-next/build_board.py build
          --repo "$GITHUB_REPOSITORY"
          --out _site

      # Pages serves index.html at the site's root. The page links its icon
      # as favicon.ico beside it, so the icon goes in the same folder.
      - name: Add the page
        run: >-
          cp .claude/skills/sync-prune-next/board.html _site/index.html &&
          cp .claude/skills/sync-prune-next/favicon.ico _site/favicon.ico

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Every successful run deploys, including one whose board matches the last apart from
  # its stamp, so the stamp says when GitHub was last read.
  board-deploy:
    needs: board-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # to deploy the built site
      id-token: write # to prove to Pages that this run is the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
